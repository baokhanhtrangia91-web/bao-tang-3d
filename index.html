<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bảo Tàng Nghệ Thuật 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Cinzel:wght@500;600&family=Josefin+Sans:wght@300;400;600&display=swap"
        rel="stylesheet">
    <style>
        /* ─────────────────────────────────────────
           RESET & BASE
        ───────────────────────────────────────── */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #c9a84c;
            --gold-light: #e8c860;
            --gold-dim: #7a6530;
            --dark: #0a0a0a;
            --panel-bg: rgba(10, 8, 5, 0.90);
            --border: 1px solid rgba(201, 168, 76, 0.45);
            --font-serif: 'Cormorant Garamond', Georgia, serif;
            --font-sans: 'Josefin Sans', sans-serif;
        }

        body {
            overflow: hidden;
            background: var(--dark);
            cursor: none;
        }

        /* Con trỏ tùy chỉnh */
        body::after {
            content: '';
            position: fixed;
            width: 10px;
            height: 10px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            mix-blend-mode: difference;
        }

        canvas#bg {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* ─────────────────────────────────────────
           INTRO / INSTRUCTIONS
        ───────────────────────────────────────── */
        #instructions {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, rgba(20, 15, 8, 0.97) 0%, rgba(5, 4, 3, 0.99) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.6s ease;
            backdrop-filter: blur(2px);
        }

        #instructions.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .intro-panel {
            text-align: center;
            border: var(--border);
            padding: 52px 48px 44px;
            max-width: 440px;
            width: 90%;
            position: relative;
            background: var(--panel-bg);
        }

        .intro-panel::before,
        .intro-panel::after,
        .intro-panel>.corner-tl,
        .intro-panel>.corner-br {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            border-color: var(--gold);
            border-style: solid;
        }

        .intro-panel::before {
            top: -1px;
            left: -1px;
            border-width: 2px 0 0 2px;
        }

        .intro-panel::after {
            top: -1px;
            right: -1px;
            border-width: 2px 2px 0 0;
        }

        .corner-bl,
        .corner-br {
            position: absolute;
            width: 16px;
            height: 16px;
            border-color: var(--gold);
            border-style: solid;
        }

        .corner-bl {
            bottom: -1px;
            left: -1px;
            border-width: 0 0 2px 2px;
        }

        .corner-br {
            bottom: -1px;
            right: -1px;
            border-width: 0 2px 2px 0;
        }

        .intro-panel h1 {
            font-family: var(--font-serif);
            font-size: 1.75rem;
            font-weight: 600;
            color: var(--gold);
            letter-spacing: 0.08em;
            margin-bottom: 6px;
        }

        .intro-tagline {
            font-family: var(--font-sans);
            font-size: 0.65rem;
            font-weight: 300;
            letter-spacing: 0.35em;
            color: #555;
            text-transform: uppercase;
            margin-bottom: 32px;
        }

        .intro-divider {
            width: 48px;
            height: 1px;
            background: var(--gold-dim);
            margin: 0 auto 28px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 20px;
            text-align: left;
            margin-bottom: 32px;
        }

        .control-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-sans);
            font-size: 0.78rem;
            color: #bbb;
            font-weight: 300;
        }

        .key-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 28px;
            height: 22px;
            padding: 0 6px;
            background: rgba(201, 168, 76, 0.1);
            border: 1px solid var(--gold-dim);
            border-radius: 3px;
            font-family: var(--font-sans);
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--gold);
            letter-spacing: 0.05em;
            white-space: nowrap;
            flex-shrink: 0;
        }

        #start-btn {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 14px 42px;
            cursor: pointer;
            font-family: var(--font-sans);
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            transition: background 0.25s, color 0.25s, box-shadow 0.25s;
            position: relative;
            overflow: hidden;
        }

        #start-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--gold);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s ease;
            z-index: -1;
        }

        #start-btn:hover {
            color: var(--dark);
            box-shadow: 0 0 24px rgba(201, 168, 76, 0.3);
        }

        #start-btn:hover::before {
            transform: scaleX(1);
        }


        /* ─────────────────────────────────────────
           CROSSHAIR
        ───────────────────────────────────────── */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 18px;
            height: 18px;
            pointer-events: none;
            display: none;
        }

        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.75);
        }

        #crosshair::before {
            width: 1.5px;
            height: 100%;
            left: 8px;
            top: 0;
        }

        #crosshair::after {
            width: 100%;
            height: 1.5px;
            top: 8px;
            left: 0;
        }


        /* ─────────────────────────────────────────
           SCREENSHOT BUTTON
        ───────────────────────────────────────── */
        #screenshot-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--panel-bg);
            color: var(--gold);
            border: var(--border);
            padding: 10px 18px;
            font-family: var(--font-sans);
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            cursor: pointer;
            z-index: 5;
            transition: background 0.2s, color 0.2s;
            backdrop-filter: blur(8px);
        }

        #screenshot-btn:hover {
            background: var(--gold);
            color: var(--dark);
        }


        /* ─────────────────────────────────────────
           COORDINATES HUD (Đã được đưa về góc trái & tinh gọn)
        ───────────────────────────────────────── */
        #coords-ui {
            position: absolute;
            bottom: 14px;
            left: 14px;
            background: rgba(0, 0, 0, 0.5);
            border-left: 2px solid #00cc44;
            /* Vạch trang trí bên trái */
            color: #00cc44;
            padding: 4px 12px;
            font-family: 'Courier New', monospace;
            font-size: 0.68rem;
            z-index: 5;
            display: none;
            backdrop-filter: blur(4px);
            letter-spacing: 0.05em;
            pointer-events: none;
        }

        /* Hiện HUD khi pointer lock */
        body.pointer-locked #coords-ui {
            display: block !important;
        }

        body.pointer-locked #crosshair {
            display: block;
        }


        /* ─────────────────────────────────────────
           ART INFO PANEL
        ───────────────────────────────────────── */
        #art-description {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--panel-bg);
            color: #e8e0d4;
            border: var(--border);
            padding: 32px 36px 28px;
            max-width: 500px;
            width: 90%;
            font-family: 'Be Vietnam Pro', sans-serif;
            display: none;
            text-align: left;
            z-index: 15;
            border-radius: 2px;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(201, 168, 76, 0.08);
            backdrop-filter: blur(16px);
        }

        #art-description .close-btn {
            position: absolute;
            top: 12px;
            right: 14px;
            background: transparent;
            border: none;
            color: var(--gold-dim);
            font-size: 1.4rem;
            cursor: pointer;
            line-height: 1;
            transition: color 0.15s;
            font-family: sans-serif;
        }

        #art-description .close-btn:hover {
            color: var(--gold);
        }

        #art-title {
            font-size: 1.45rem;
            font-weight: 600;
            color: var(--gold);
            margin-bottom: 4px;
            line-height: 1.3;
        }

        #art-text {
            font-size: 1.0rem;
            line-height: 1.75;
            color: #c8bfb0;
        }

        #art-title::after {
            content: '';
            display: block;
            width: 32px;
            height: 1px;
            background: var(--gold-dim);
            margin-top: 10px;
            margin-bottom: 14px;
        }


        /* ─────────────────────────────────────────
           SUBTITLES
        ───────────────────────────────────────── */
        #subtitle-container {
            position: absolute;
            bottom: 44px;
            left: 50%;
            transform: translateX(-50%);
            width: 72%;
            text-align: center;
            pointer-events: none;
            z-index: 20;
            display: none;
        }

        #subtitle-text {
            background: rgba(0, 0, 0, 0.72);
            color: #f0e8d8;
            padding: 12px 28px;
            border-radius: 4px;
            font-size: 1.2rem;
            font-family: var(--font-serif);
            display: inline-block;
            text-shadow: 1px 1px 3px #000;
            line-height: 1.6;
            border-bottom: 2px solid var(--gold-dim);
            backdrop-filter: blur(8px);
        }


        /* ─────────────────────────────────────────
           ROOM INDICATOR
        ───────────────────────────────────────── */
        #room-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            font-family: 'Cinzel', serif;
            font-size: 3rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;

            color: var(--gold);
            text-align: center;

            pointer-events: none;
            display: none;
            z-index: 20;

            text-shadow: 0 0 20px rgba(255, 255, 255, 0.4),
                0 0 40px rgba(0, 0, 0, 0.8);
        }

        body.pointer-locked #room-label {
            display: block;
        }


        /* ─────────────────────────────────────────
           MUSIC TOGGLE BUTTON
        ───────────────────────────────────────── */
        #music-btn {
            position: absolute;
            top: 60px;
            right: 20px;
            background: var(--panel-bg);
            color: var(--gold);
            border: var(--border);
            padding: 9px 16px;
            font-family: var(--font-sans);
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            cursor: pointer;
            z-index: 5;
            transition: background 0.2s, color 0.2s;
            backdrop-filter: blur(8px);
            display: none;
        }

        #music-btn:hover {
            background: var(--gold);
            color: var(--dark);
        }

        body.pointer-locked #music-btn {
            display: block;
        }
    </style>
</head>

<body>
    <canvas id="bg"></canvas>

    <!-- ── Instructions / Intro ── -->
    <div id="instructions">
        <div class="intro-panel">
            <span class="corner-bl"></span>
            <span class="corner-br"></span>

            <h1>BẢO TÀNG NGHỆ THUẬT</h1>
            <p class="intro-tagline">Virtual Gallery · 3D Experience</p>
            <div class="intro-divider"></div>

            <div class="controls-grid">
                <div class="control-item"><span class="key-badge">W A S D</span><span>Di chuyển</span></div>
                <div class="control-item"><span class="key-badge">Chuột</span><span>Nhìn xung quanh</span></div>
                <div class="control-item"><span class="key-badge">Shift</span><span>Chạy nhanh</span></div>
                <div class="control-item"><span class="key-badge">Ctrl</span><span>Ngồi xuống</span></div>
                <div class="control-item"><span class="key-badge">Space</span><span>Nhảy</span></div>
                <div class="control-item"><span class="key-badge">Z</span><span>Zoom in</span></div>
                <div class="control-item"><span class="key-badge">E / Click</span><span>Tương tác</span></div>
                <div class="control-item"><span class="key-badge">R</span><span>Chụp ảnh</span></div>
                <div class="control-item"><span class="key-badge">ESC</span><span>Tạm dừng</span></div>
                <div class="control-item"><span class="key-badge">F3</span><span>FPS counter</span></div>
            </div>

            <button id="start-btn">KHÁM PHÁ NGAY</button>
        </div>
    </div>

    <!-- ── HUD ── -->
    <div id="room-label">Sảnh Trung Tâm</div>
    <div id="coords-ui">X: 0.00 &nbsp;|&nbsp; Y: 0.00 &nbsp;|&nbsp; Z: 0.00</div>
    <div id="crosshair"></div>

    <!-- ── Buttons ── -->
    <button id="screenshot-btn" title="Phím tắt: R">📷 Chụp ảnh</button>
    <button id="music-btn" title="Nhạc nền">🎵 Nhạc</button>

    <!-- ── Subtitles ── -->
    <div id="subtitle-container"><span id="subtitle-text"></span></div>

    <!-- ── Art Info Panel ── -->
    <div id="art-description">
        <div id="art-title"></div>
        <div id="art-text"></div>
    </div>

    <!-- ── Audio element ── -->
    <audio id="art-audio" style="display:none;"></audio>

    <script>
        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement) {
                document.body.classList.add('pointer-locked');
            } else {
                document.body.classList.remove('pointer-locked');
            }
        });

        // Room label updater
        const ROOM_NAMES = ['Phòng Trưng Bày I', 'Sảnh Trung Tâm', 'Phòng Trưng Bày II'];
        const roomLabelEl = document.getElementById('room-label');
        window.addEventListener('roomchange', (e) => {
            if (roomLabelEl) {
                roomLabelEl.textContent = ROOM_NAMES[e.detail.room] ?? '';
                roomLabelEl.style.transition = 'none';
                roomLabelEl.style.opacity = '0';
                requestAnimationFrame(() => {
                    roomLabelEl.style.transition = 'opacity 2s ease';
                    roomLabelEl.style.opacity = '1';
                    setTimeout(() => {
                        roomLabelEl.style.opacity = '0';
                    }, 3000);
                });
            }
        });

        // Music button
        const musicBtn = document.getElementById('music-btn');
        let musicOn = true;
        musicBtn?.addEventListener('click', (e) => {
            e.stopPropagation();
            musicOn = !musicOn;
            musicBtn.textContent = musicOn ? '🎵 Nhạc' : '🔇 Tắt nhạc';
            window.dispatchEvent(new CustomEvent('musictoggle', { detail: { on: musicOn } }));
        });
    </script>

    <script type="module" src="./main.js"></script>
</body>

</html>
